<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
    <title>Шахматная доска без фигур</title>
    <rect width="480" height="480" fill="#faf8f1"/>
    <defs>
        <pattern id="squares" width="104" height="104" patternUnits="userSpaceOnUse" x="32" y="32">
            <rect width="104" height="104" fill="#f0d9b5"/>
            <rect x="52" width="52" height="52" fill="#b58863"/>
            <rect y="52" width="52" height="52" fill="#b58863"/>
        </pattern>
    </defs>
    <rect x="32" y="32" width="416" height="416" fill="url(#squares)" stroke="#493829" stroke-width="3"/>
</svg>
